<!doctype html>
<html lang="pt-BR">
  <head>
    <title>Pedido inválido (400) · Safra</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0c1810">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <style>
      * { box-sizing: border-box; margin: 0; }
      html { color-scheme: dark; }
      body {
        background: #0c1810; color: #eaf3e4; display: grid; place-items: center; min-height: 100dvh; padding: 16px;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5; -webkit-text-size-adjust: 100%;
      }
      main { max-width: 28rem; text-align: center; }
      img { width: 64px; height: 64px; margin-bottom: 1.5rem; }
      .code { color: #8bc34a; font-weight: 700; letter-spacing: .08em; font-size: .875rem; }
      h1 { font-size: 1.75rem; line-height: 1.2; margin: .25rem 0 .75rem; }
      p { color: #a3bba8; }
      a {
        display: inline-block; margin-top: 1.5rem; padding: .625rem 1.25rem; border-radius: 8px;
        background: #2e7d32; color: #fff; font-weight: 600; text-decoration: none;
      }
      a:hover { background: #3a8f3e; }
      a:focus-visible { outline: 3px solid #8bc34a; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="Safra">
      <p class="code">ERRO 400</p>
      <h1>Pedido inválido</h1>
      <p>O navegador enviou algo que o Safra não conseguiu entender. Volte e tente de novo.</p>
      <a href="/">Voltar ao início</a>
    </main>
  </body>
</html>
