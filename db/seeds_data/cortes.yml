# Cortes. O produto processado = matéria-prima + corte. O setor e a antecedência vêm do corte.
# medida: referência confirmada na R1.15 (D12); a medida escrita no pedido orienta o preparo (R1.14).
# antecedencia_dias: 0 = produz no dia da entrega, 1 = véspera. Hipótese tirada da comparação com as planilhas de 13 e 15/10; confirmar.
- codigo: cubos
  nome: Cubos
  setor: manual
  nome_setor: Cortes manuais
  antecedencia_dias: 1
  medida: '20 × 20 × 20 mm'
- codigo: cubinhos
  nome: Cubinhos 10x10 mm
  setor: cubinho
  nome_setor: Cubinhos 10×10 mm
  antecedencia_dias: 1
  medida: '10 × 10 × 10 mm'
- codigo: ralado
  nome: Ralado
  setor: ralpic
